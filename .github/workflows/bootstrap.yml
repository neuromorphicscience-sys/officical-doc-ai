name: Bootstrap project source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand project bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .bootstrap-complete ]; then
            echo "Bootstrap already complete."
            exit 0
          fi
          cat bootstrap.part* > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.tgz
          tar -xzf /tmp/project.tgz -C .
          rm -f bootstrap.part*
          touch .bootstrap-complete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: bootstrap semantic DOCX formatter with polished UI"
          git push
